get_shopping_list:
  name: Récupérer la liste de courses
  description: Renvoie les articles et leurs identifiants, quantités et états.
set_shopping_item:
  name: Cocher ou décocher un article
  description: Modifie un article et déclenche la synchronisation de la liste.
  fields:
    item_id:
      name: Identifiant de l'article
      required: true
      selector:
        text:
    checked:
      name: Acheté
      required: true
      selector:
        boolean:
generate_shopping_list:
  name: Générer la liste de courses
  description: Additionne les ingrédients des repas prévus sur la période (semaine en cours par défaut, 31 jours au maximum).
  fields:
    start:
      name: Du
      required: false
      selector:
        date:
    end:
      name: Au
      description: Par défaut, 6 jours après le début.
      required: false
      selector:
        date:
